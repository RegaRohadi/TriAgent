<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scrape &amp; Summarize</title>
<script>
(() => {
  const root = document.documentElement;
  const query = matchMedia("(prefers-color-scheme: dark)");
  let chosen = null;
  const apply = () => { root.dataset.theme = chosen || (query.matches ? "dark" : "light"); };
  apply();
  query.addEventListener("change", apply);
  addEventListener("message", (e) => {
    if (e.source !== window.parent || e.data?.type !== "theme") return;
    if (e.data.theme === "light" || e.data.theme === "dark") { chosen = e.data.theme; apply(); }
  });
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap">
<style>
    :root {
    --bg: #ffffff; --panel: #ffffff; --ink: #0a0a0a; --muted: #737373; --faint: #a3a3a3;
    --line: #ebebeb; --line-hover: #d4d4d4; --field: #ebebeb; --hover: #f7f7f7;
    --accent: #155dfc; --accent-hi: #2b7fff; --accent-lo: #1447e6; --focus: #2b7fff;
    --ok: #3d6300; --ok-bg: #d8f999; --warn: #854d0e; --crit: #9f1239; --crit-bg: #ffe4e6;
    --code-bg: #f7f7f7; --shadow-card: 0 1px 1px 0 rgb(0 0 0 / 0.05); --shadow-xs: 0 1px 2px 0 rgb(0 0 0 / 0.05);
  }
  :root { color-scheme: light; }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121212; --panel: #121212; --ink: #fafafa; --muted: #a3a3a3; --faint: #737373;
    --line: #404040; --line-hover: #737373; --field: #262626; --hover: #262626;
    --accent: #51a2ff; --accent-hi: #2b7fff; --accent-lo: #155dfc; --focus: #2b7fff;
    --ok: #7ccf00; --ok-bg: rgb(53 83 14 / 0.6); --warn: #f0b100; --crit: #ff2056; --crit-bg: rgb(77 2 24 / 0.6);
    --code-bg: #262626; --shadow-card: 0 1px 1px 0 rgb(0 0 0 / 0.14); --shadow-xs: 0 1px 2px 0 rgb(0 0 0 / 0.18);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased;
         font: 14px/1.5 Inter, ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif; }
  header { padding: 16px 24px; border-bottom: 1px solid var(--line); background: var(--panel);
           display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  body.embedded header { display: none; }
  h1 { font-size: 18px; line-height: 26px; font-weight: 600; margin: 0; }
  .sub { color: var(--muted); font-size: 12px; letter-spacing: .15px; }
  .wrap { display: grid; grid-template-columns: minmax(300px, 380px) 1fr; gap: 20px; padding: 24px; align-items: start; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 20px;
          box-shadow: var(--shadow-card); min-width: 0; }
  .card h2 { font-size: 16px; line-height: 22px; font-weight: 600; color: var(--ink); margin: 0 0 14px; }
  input, button { font: inherit; color: inherit; }
  input { width: 100%; background: var(--field); border: 0; border-radius: 10px; padding: 8px 12px; outline: none;
          box-shadow: inset 0 0 0 2px transparent; transition: box-shadow .15s ease; }
  input::placeholder { color: var(--faint); }
  input:hover { box-shadow: inset 0 0 0 2px var(--line-hover); }
  input:focus { box-shadow: inset 0 0 0 2px var(--muted); }
  label { display: block; font-size: 14px; line-height: 20px; font-weight: 500; color: var(--ink); margin: 14px 0 4px; }
  .row { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  button { background: linear-gradient(180deg, var(--accent-hi), var(--accent-lo)); color: #fff; border: 0;
           border-radius: 10px; padding: 8px 12px; height: 36px; font-weight: 500; cursor: pointer;
           box-shadow: var(--shadow-xs); transition: filter .15s ease, transform .2s ease; }
  button:hover:not(:disabled) { filter: brightness(1.08); }
  button:active:not(:disabled) { transform: scale(.98); }
  button:focus-visible, .chips button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  button.ghost { background: var(--panel); color: var(--ink); border: 1px solid var(--line); }
  button.ghost:hover:not(:disabled) { filter: none; background: var(--hover); border-color: var(--line-hover); }
  button:disabled { opacity: .55; cursor: progress; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .chips button { background: transparent; border: 0; color: var(--muted); box-shadow: none; height: auto;
                  padding: 5px 8px; border-radius: 10px; font-size: 14px; font-weight: 500; }
  .chips button:hover { filter: none; color: var(--ink); background: var(--hover); }
  .note { font-size: 12px; letter-spacing: .15px; color: var(--muted); margin: 10px 0 0; }
  .empty { color: var(--muted); font-style: italic; }
  .stack > * + * { margin-top: 16px; }
  .badge { display: inline-block; padding: 2px 6px; border-radius: 6px; font-size: 14px; font-weight: 500; }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.crit { background: var(--crit-bg); color: var(--crit); }
  .pill { font-size: 12px; letter-spacing: .15px; font-weight: 500; padding: 4px 6px; border-radius: 6px;
          background: var(--code-bg); color: var(--muted); }
  .summary { white-space: pre-wrap; font-size: 14.5px; line-height: 1.6; margin: 10px 0 0; }
  ul.points { margin: 12px 0 0; padding-left: 18px; }
  ul.points li + li { margin-top: 4px; }
  table.metrics { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.metrics th { text-align: left; color: var(--muted); font-weight: 600; padding: 7px 8px;
                     width: 34%; vertical-align: top; border-bottom: 1px solid var(--line); }
  table.metrics td { padding: 7px 8px; border-bottom: 1px solid var(--line); }
  .cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 1100px) { .cmp { grid-template-columns: 1fr; } }
  .reason { border-left: 2px solid var(--crit); padding: 10px 12px; border-radius: 0 12px 12px 0;
            background: var(--crit-bg); overflow-wrap: anywhere; }
  .defects { color: var(--muted); font-size: 12px; margin: 14px 0 0; }
  code { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 12.5px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Scrape &amp; Summarize</h1>
  <span class="sub" id="meta">loading…</span>
</header>

<div class="wrap">
  <div class="card">
    <h2>Page to summarize</h2>
    <label for="url">URL</label>
    <input type="url" id="url" placeholder="https://en.wikipedia.org/wiki/…" autocomplete="off">
    <div class="chips" id="examples"></div>
    <label for="maxWords">Word budget</label>
    <input type="number" id="maxWords" min="20" max="500" step="10">
    <div class="row">
      <button id="summarize">Summarize</button>
      <button id="compare" class="ghost">Compare before / after</button>
    </div>
    <p class="note">Compare runs <code>naive_scraper.py</code> and the fixed pipeline on the same page, side by side.</p>
  </div>

  <div id="out" class="stack"><div class="card empty">Enter a URL, or pick an example.</div></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
if (window.self !== window.top) document.body.classList.add("embedded");

const EXAMPLES = [
  ["Wikipedia · RAG", "https://en.wikipedia.org/wiki/Retrieval-augmented_generation"],
  ["Wikipedia · Web scraping", "https://en.wikipedia.org/wiki/Web_scraping"],
];
let defaultBudget = 100;

async function loadMeta() {
  try {
    const h = await (await fetch("/api/health")).json();
    defaultBudget = h.summary_max_words;
    $("maxWords").min = h.summary_min_words;
    if (!$("maxWords").value) $("maxWords").value = h.summary_max_words;
    $("meta").textContent = `llm: ${h.llm_backend} · chunks of ${h.chunk_max_tokens} tokens · ${h.map_workers} parallel map calls`;
  } catch { $("meta").textContent = "backend unavailable"; }
}

$("examples").innerHTML = EXAMPLES.map(([label, url]) =>
  `<button type="button" data-url="${esc(url)}">${esc(label)}</button>`).join("");
$("examples").querySelectorAll("button").forEach(btn =>
  btn.addEventListener("click", () => { $("url").value = btn.dataset.url; $("url").focus(); }));

const fmt = (n) => Number(n).toLocaleString("en-US");
const pct = (x) => `${Math.round(x * 100)}%`;
const secs = (ms) => `${(ms / 1000).toFixed(1)} s`;

function metricsTable(r) {
  const smaller = r.raw_bytes ? 1 - r.extracted_chars / r.raw_bytes : 0;
  const rows = [
    ["Fetched", `${fmt(r.raw_bytes)} bytes`],
    ["Sent to the model", `${fmt(r.extracted_chars)} chars — ${pct(smaller)} smaller than the raw page`],
    ["Extraction", `${esc(r.extraction_strategy)} · ${pct(r.reduction_ratio)} of the page's text dropped as navigation and chrome`],
    ["Summarization", r.strategy === "map_reduce"
      ? `map-reduce · ${r.chunk_count} chunks · ${r.reduce_rounds} extra reduce round(s)`
      : "single pass — the page fit in one chunk"],
    ["Model calls", fmt(r.llm_calls)],
    ["Guardrail", `${esc(r.guardrail_enforced_by)}${r.guardrail_attempts ? ` · ${r.guardrail_attempts} rewrite(s)` : ""}`],
    ["Elapsed", secs(r.elapsed_ms)],
  ];
  return `<table class="metrics">${rows.map(([k, v]) => `<tr><th>${k}</th><td>${v}</td></tr>`).join("")}</table>`;
}

function summaryBlock(r, budget) {
  const points = (r.key_points || []).length
    ? `<ul class="points">${r.key_points.map(p => `<li>${esc(p)}</li>`).join("")}</ul>` : "";
  return `<p><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a></p>
    <p><span class="badge ${r.within_budget ? "ok" : "crit"}">${r.word_count} / ${budget} words</span>
       <span class="pill">enforced by: ${esc(r.guardrail_enforced_by)}</span></p>
    <p class="summary">${esc(r.summary)}</p>${points}`;
}

function renderSummary(r, budget) {
  $("out").innerHTML = `
    <div class="card"><h2>Summary</h2>${summaryBlock(r, budget)}</div>
    <div class="card"><h2>What the pipeline did</h2>${metricsTable(r)}</div>`;
}

function renderCompare(data, budget) {
  const n = data.naive, f = data.fixed;
  const before = n.error
    ? `<div class="reason"><b>Failed</b> after ${secs(n.elapsed_ms)}<br><code>${esc(n.error)}</code></div>`
    : `<p><span class="pill">${n.word_count} words · no length check</span> <span class="pill">${secs(n.elapsed_ms)}</span></p>
       <p class="summary">${esc(n.summary)}</p>`;
  const after = f.error
    ? `<div class="reason"><b>Failed</b><br><code>${esc(f.error)}</code></div>`
    : `${summaryBlock(f.result, budget)}<div style="margin-top:16px">${metricsTable(f.result)}</div>`;
  $("out").innerHTML = `<div class="cmp">
      <div class="card"><h2>Before — naive_scraper.py</h2>${before}
        <p class="defects">No timeout, no User-Agent, no status or content-type check, the whole DOM in one
        prompt, no length check. A fluent summary here is not proof it read the right page.</p></div>
      <div class="card"><h2>After — pipeline.py</h2>${after}</div>
    </div>`;
}

let ticker = null;
function showWorking(label) {
  const started = Date.now();
  const paint = () => {
    $("out").innerHTML = `<div class="card"><h2>${esc(label)}</h2>
      <p class="empty">Working… ${Math.round((Date.now() - started) / 1000)} s</p>
      <p class="note">Fetch → extract → one model call per chunk → merge → length check.
      With Gemini this usually takes 10–60 s.</p></div>`;
  };
  paint();
  ticker = setInterval(paint, 1000);
}
function stopWorking() { clearInterval(ticker); ticker = null; }
function setBusy(busy) { $("summarize").disabled = busy; $("compare").disabled = busy; }

function describeError(detail) {
  return Array.isArray(detail) ? detail.map(e => e.msg).join("; ") : detail;
}

async function run(mode) {
  const url = $("url").value.trim();
  if (!url) { $("url").focus(); return; }
  const parsed = parseInt($("maxWords").value, 10);
  const maxWords = Number.isFinite(parsed) ? parsed : null;
  const budget = maxWords ?? defaultBudget;

  setBusy(true);
  showWorking(mode === "compare" ? "Comparing before and after" : "Summarizing");
  try {
    const res = await fetch(mode === "compare" ? "/api/compare" : "/api/summarize", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url, max_words: maxWords }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(describeError(data.detail) || res.statusText);
    stopWorking();
    if (mode === "compare") renderCompare(data, budget); else renderSummary(data, budget);
  } catch (err) {
    stopWorking();
    $("out").innerHTML = `<div class="card"><h2>Could not summarize</h2><div class="reason">${esc(err.message)}</div></div>`;
  } finally {
    setBusy(false);
  }
}

$("summarize").addEventListener("click", () => run("summarize"));
$("compare").addEventListener("click", () => run("compare"));
$("url").addEventListener("keydown", (e) => { if (e.key === "Enter") run("summarize"); });

const params = new URLSearchParams(location.search);
if (params.get("url")) $("url").value = params.get("url");
if (params.get("max")) $("maxWords").value = params.get("max");
loadMeta().then(() => {
  const mode = params.get("run");
  if (mode === "summarize" || mode === "compare") run(mode);
});
</script>
</body>
</html>
